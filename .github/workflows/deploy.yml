
name: Deploy Quartz site

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy player-facing notes into Quartz content
        shell: bash
        run: |
          set -euo pipefail

          STAGING="player-content"
          SOURCE="$STAGING/8. Player Wiki"

          mkdir -p content

          # The exported index becomes the site homepage.
          if [ -f "$SOURCE/index.md" ]; then
            cp "$SOURCE/index.md" content/index.md
          fi

          # Copy approved notes directly into content/, preserving folders.
          if [ -d "$SOURCE" ]; then
            rsync -a --exclude='/index.md' "$SOURCE/" content/
          fi

          # Preserve the separate attachment folder, if it contains files.
          if [ -d "$STAGING/z_Images" ]; then
            mkdir -p content/z_Images
            rsync -a "$STAGING/z_Images/" content/z_Images/
          fi

      - name: Copy map background asset
        run: |
          mkdir -p content/z_Images
          cp "site-assets/z_Images/Sathara Fixed With Scale.png" \
             "content/z_Images/Sathara Fixed With Scale.png"
             
      - name: Patch Leaflet map validation
        run: |
          FILE=".quartz/plugins/quartz-leaflet-bases-plugin/src/scripts/leaflet-map.inline.ts"
          test -f "$FILE"
          sed -i '/dataset\["unit"\]/d' "$FILE"
          ! grep -Fq 'dataset["unit"]' "$FILE"

      - name: Build Quartz
        run: |
          npx quartz build
          echo "=== Sathara map image in build output ==="
          find public -iname '*sathara*' -print
          echo "=== Generated test-note files ==="
          find public -iname '*test*note*' -print
          echo "=== Generated player-wiki files ==="
          find public/player-wiki -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
