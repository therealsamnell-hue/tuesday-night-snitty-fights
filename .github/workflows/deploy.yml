
name: Deploy Quartz site

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
     
      - name: Copy player-facing notes into Quartz content
        run: |
          test -d "player-content/8. Player Wiki"
          mkdir -p content/player-wiki
          rsync -a --delete "player-content/8. Player Wiki/" content/player-wiki/

      - name: Build Quartz
        run: |
          npx quartz build
          echo "=== Generated test-note files ==="
          find public -iname '*test*note*' -print
          echo "=== Generated player-wiki files ==="
          find public/player-wiki -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
